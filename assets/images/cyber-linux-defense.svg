<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
<title id="title">Linux security architecture under cyber attack</title><desc id="desc">Linux penguin over kernel, eBPF and hardware layers protected by a glowing shield from malicious traffic.</desc>
<defs>
