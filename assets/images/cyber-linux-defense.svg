<linearGradient id="blue" x2="0" y2="1"><stop stop-color="#33afff"/><stop offset="1" stop-color="#14447b"/></linearGradient>
<linearGradient id="red" x2="0" y2="1"><stop stop-color="#fc7086"/><stop offset="1" stop-color="#91243c"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#1affe1" stop-opacity=".23"/><stop offset=".6" stop-color="#008e9e" stop-opacity=".08"/><stop offset="1" stop-opacity="0"/></radialGradient>
