# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Mirror the canonical blog to the academic site automatically every hour.
  schedule:
    - cron: '23 * * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Synchronize blog homepage and posts from research-blog
        run: python3 scripts/sync_research_blog.py
      - name: Verify mirrored poster and blog files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = [
              Path('_posts/2026-11-06-when-ai-agents-go-rogue-research-poster.md'),
              Path('assets/blog/When AI Agents Go Rogue Who Protects Your Files.pdf'),
              Path('assets/blog/ai-agents-go-rogue-poster-overview.svg'),
          ]
          for p in checks:
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'Missing required blog resource: {p}')
              print(f'OK: {p} ({p.stat().st_size} bytes)')
          PY
      - name: Validate six-language content and JavaScript
        run: |
          node --check assets/js/site-i18n.js
          node --check assets/js/blog-bilingual.js
          python3 - <<'PY'
          from pathlib import Path
          languages = ('en', 'zh', 'ja', 'ko', 'de', 'fr')
          posts = (
            Path('_posts/2026-11-06-secure-ubuntu-file-sharing.md'),
            Path('_posts/2026-11-06-when-ai-agents-go-rogue-research-poster.md'),
          )
          for post in posts:
              content = post.read_text(encoding='utf-8')
              for language in languages:
                  assert f'data-blog-lang="{language}"' in content, f'Missing {language}: {post}'
                  assert f'title_{language}:' in content, f'Missing title {language}: {post}'
              print('Six languages verified:', post)
          for path in ('assets/css/blog-bilingual.css', 'assets/js/blog-bilingual.js'):
              assert Path(path).is_file(), f'File missing after synchronization: {path}'
          PY
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Validate generated public poster and blog pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          output = Path('_site')
          files = [
              output / 'assets/blog/When AI Agents Go Rogue Who Protects Your Files.pdf',
              output / 'blog/index.html',
              output / 'blog/2026/11/06/when-ai-agents-go-rogue-research-poster/index.html',
          ]
          for p in files:
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'PUBLIC PAGE MISSING: {p}')
              print(f'Built successfully: {p} ({p.stat().st_size} bytes)')
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
