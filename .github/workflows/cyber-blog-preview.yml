name: Cyber Blog Visual Preview

on:
  push:
    branches: [master]
    paths:
      - "_pages/blog.md"
      - "_includes/masthead.html"
      - "_includes/head/custom.html"
      - "_includes/footer/custom.html"
      - "assets/css/site-language.css"
      - "assets/js/site-i18n.js"
      - "assets/js/home-languages.js"
      - "assets/css/home-academic.css"
      - "assets/css/visitor-geo.css"
      - "assets/js/visitor-geo*.js"
      - "workers/**"
      - "_layouts/cyber-blog.html"
      - "assets/css/cyber-blog.css"
      - "assets/css/cyber-cinematic.css"
      - "assets/images/cyber-*.svg"
      - "assets/images/agent-storage-trust-boundary.svg"
      - "_pages/about.md"
      - "_pages/security-deadlines.html"
      - "_data/security_deadlines.yml"
      - "_data/security_deadlines_auto.json"
      - "_data/security_ccf.yml"
      - "assets/css/security-ops-upgrade.css"
      - "assets/js/security-ops-upgrade.js"
      - "assets/css/blog-deadlines-ops.css"
      - "assets/js/blog-deadlines-ops.js"
      - "_data/navigation.yml"
      - "assets/css/security-deadlines.css"
      - "assets/js/security-deadlines.js"
      - "assets/js/security-inline.js"
      - "assets/js/cyber-*.js"
      - ".github/workflows/cyber-blog-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install Chinese font coverage for international screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Verify localization and visitor-map JavaScript
        run: |
          node --check assets/js/site-i18n.js
          node --check assets/js/home-languages.js
          node --check assets/js/visitor-geo.js
          node --check assets/js/visitor-geo-config.js
          node --check workers/visitor-map-worker.js

      - name: Build site
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Render desktop and mobile previews
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/cyber-blog-server.log 2>&1 &
          for attempt in {1..12}; do
            if curl --fail --silent http://127.0.0.1:8765/blog/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p previews
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,3700 --virtual-time-budget=1500 --screenshot=previews/Zedong_Zhou_Cyber_Blog_Desktop.png http://127.0.0.1:8765/blog/
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=390,6200 --virtual-time-budget=1500 --screenshot=previews/Zedong_Zhou_Cyber_Blog_Mobile.png http://127.0.0.1:8765/blog/

          # Verify client-side language switch with real headless Chrome (home + blog).
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2000 --dump-dom "http://127.0.0.1:8765/?lang=zh" > /tmp/zz-home-zh.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2000 --dump-dom "http://127.0.0.1:8765/blog/?lang=fr" > /tmp/zz-blog-fr.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2000 --dump-dom "http://127.0.0.1:8765/blog/?lang=de" > /tmp/zz-blog-de.html
          grep -q "欢迎来到我的网站" /tmp/zz-home-zh.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2000 --dump-dom "http://127.0.0.1:8765/?lang=ja" > /tmp/zz-home-ja.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2000 --dump-dom "http://127.0.0.1:8765/?lang=ko" > /tmp/zz-home-ko.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2000 --dump-dom "http://127.0.0.1:8765/?lang=de" > /tmp/zz-home-de.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2000 --dump-dom "http://127.0.0.1:8765/?lang=fr" > /tmp/zz-home-fr.html
          # Test the rendered DOM, not translation strings hidden in a script.
          grep -q '欢迎来到我的网站' /tmp/zz-home-zh.html
          grep -q '计算机科学博士研究生' /tmp/zz-home-zh.html
          grep -q '网站访问概况' /tmp/zz-home-zh.html
          grep -q '私のウェブサイトへようこそ' /tmp/zz-home-ja.html
          grep -q 'コンピュータサイエンス博士課程' /tmp/zz-home-ja.html
          grep -q '제 웹사이트에 오신 것을 환영합니다' /tmp/zz-home-ko.html
          grep -q '컴퓨터과학 박사과정' /tmp/zz-home-ko.html
          grep -q 'Willkommen auf meiner Website' /tmp/zz-home-de.html
          grep -q 'Bienvenue sur mon site' /tmp/zz-home-fr.html
          grep -q 'class="visitor-geo home-visitor-activity"' /tmp/zz-home-ja.html
          grep -q 'data-home-language' /tmp/zz-home-ko.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,3800 --virtual-time-budget=1700 --screenshot=previews/Zedong_Home_Japanese.png "http://127.0.0.1:8765/?lang=ja"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,3800 --virtual-time-budget=1700 --screenshot=previews/Zedong_Home_Korean.png "http://127.0.0.1:8765/?lang=ko"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,3800 --virtual-time-budget=1700 --screenshot=previews/Zedong_Home_German.png "http://127.0.0.1:8765/?lang=de"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,3800 --virtual-time-budget=1700 --screenshot=previews/Zedong_Home_French.png "http://127.0.0.1:8765/?lang=fr"

          grep -q "RADAR MONDIAL DES VISITEURS" /tmp/zz-blog-fr.html
          grep -q "WELTWEITER BESUCHERRADAR" /tmp/zz-blog-de.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,3000 --virtual-time-budget=1700 --screenshot=previews/Zedong_Home_Chinese.png "http://127.0.0.1:8765/?lang=zh"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,3500 --virtual-time-budget=1700 --screenshot=previews/Zedong_Blog_French.png "http://127.0.0.1:8765/blog/?lang=fr"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,3500 --virtual-time-budget=1700 --screenshot=previews/Zedong_Blog_German.png "http://127.0.0.1:8765/blog/?lang=de"

          # Also capture the actual academic home page without relying on custom-domain DNS.
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,3800 --virtual-time-budget=1500 --screenshot=previews/Zedong_Zhou_Homepage_Desktop.png http://127.0.0.1:8765/
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=390,6200 --virtual-time-budget=1500 --screenshot=previews/Zedong_Zhou_Homepage_Mobile.png http://127.0.0.1:8765/
          # Capture this independent subpage without relying on external DNS.
          curl --fail --silent http://127.0.0.1:8765/security-deadlines/ >/dev/null
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,2200 --virtual-time-budget=2500 --screenshot=previews/Zedong_Zhou_Security_Deadlines_Desktop.png http://127.0.0.1:8765/security-deadlines/
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=390,3400 --virtual-time-budget=2500 --screenshot=previews/Zedong_Zhou_Security_Deadlines_Mobile.png http://127.0.0.1:8765/security-deadlines/
          # Full-size capture includes the CCF-ranked venue cards, Timeline/Table switcher and additional venue calendar.
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,7000 --virtual-time-budget=3500 --screenshot=previews/Zedong_Zhou_Security_Deadlines_Full_Desktop.png http://127.0.0.1:8765/security-deadlines/
          test -s previews/Zedong_Zhou_Security_Deadlines_Full_Desktop.png
          test -s previews/Zedong_Zhou_Security_Deadlines_Desktop.png
          test -s previews/Zedong_Zhou_Security_Deadlines_Mobile.png
          test -s previews/Zedong_Zhou_Homepage_Desktop.png
          test -s previews/Zedong_Zhou_Homepage_Mobile.png
          test -s previews/Zedong_Zhou_Cyber_Blog_Desktop.png
          test -s previews/Zedong_Zhou_Cyber_Blog_Mobile.png

      - uses: actions/upload-artifact@v4
        with:
          name: cyber-blog-previews
          path: previews/*.png
          if-no-files-found: error
          retention-days: 14
